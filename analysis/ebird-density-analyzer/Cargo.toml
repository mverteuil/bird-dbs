[package]
name = "ebird-density-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["BirdNET-Pi Contributors"]
description = "Analyze eBird dataset density for H3-based region pack generation"
license = "CC-BY-NC-SA-4.0"

[[bin]]
name = "ebird-density-analyzer"
path = "src/main.rs"

[dependencies]
# H3 hexagonal grid
h3o = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# CSV parsing (for eBird TSV files)
csv = "1.3"

# Tar & Compression
tar = "0.4"
flate2 = "1.0"

# Progress reporting
indicatif = "0.17"

# TUI
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
