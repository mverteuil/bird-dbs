[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "release-publisher"
version = "0.1.0"
description = "Automated GitHub release publisher for eBird region pack databases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0"
]

[project.scripts]
release-publisher = "release_publisher.cli:main"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
