[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "mypy>=1.5.0",
  "types-requests>=2.31.0",
  "ruff>=0.1.0"
]

[project]
name = "ioc-reference-builder"
version = "0.1.0"
description = "IOC World Bird List reference database builder for BirdNET-Pi"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "BirdNET-Pi Contributors"}
]
keywords = ["birds", "ornithology", "ioc", "taxonomy", "multilingual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "pandas>=2.0.0",
  "sqlalchemy>=2.0.0",
  "openpyxl>=3.1.0",
  "requests>=2.31.0",
  "sqlmodel>=0.0.24"
]

[project.scripts]
build-ioc-reference = "ioc_database_builder:main"
process-ioc-data = "process_ioc_data:main"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/pytest-of-*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pandas.*"]
ignore_missing_imports = true

[tool.pyright]
exclude = ["**/build", "**/__pycache__"]
include = ["."]
pythonVersion = "3.12"
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryIsInstance = "none"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["docs", "*.egg-info", ".git", ".venv", "data"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=.",
  "--cov-branch",
  "--cov-config=pyproject.toml",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP" # pyupgrade
]
ignore = [
  "E501" # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["ioc_database_builder", "ioc_models", "ioc"]
