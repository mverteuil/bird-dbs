[dependencies]
# Database
rusqlite = {version = "0.32", features = ["bundled"]}
serde_json = "1.0"
# H3 hexagonal grid
h3o = "0.6"
# Serialization
serde = {version = "1.0", features = ["derive"]}
serde_yaml = "0.9"
# Date/Time
chrono = {version = "0.4", features = ["serde"]}
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Logging
env_logger = "0.11"
log = "0.4"
# CLI
clap = {version = "4.5", features = ["derive"]}
# CSV parsing (for eBird TSV files)
csv = "1.3"
# Tar & Compression (for future full implementation)
tar = {version = "0.4", optional = true}
flate2 = {version = "1.0", optional = true}

[features]
default = []
full = ["tar", "flate2"]

[package]
name = "birdnetpi-ebird-pack"
version = "0.1.0"
edition = "2021"
