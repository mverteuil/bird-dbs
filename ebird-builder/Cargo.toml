[dependencies]
# Database
rusqlite = {version = "0.32", features = ["bundled"]}
serde_json = "1.0"
# H3 hexagonal grid
h3o = "0.6"
# Serialization
serde = {version = "1.0", features = ["derive"]}
serde_yaml = "0.9"
# Date/Time
chrono = {version = "0.4", features = ["serde"]}
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Logging
env_logger = "0.11"
log = "0.4"
# CLI
clap = {version = "4.5", features = ["derive"]}
# CSV parsing (for eBird TSV files)
csv = "1.3"
# Parquet support
arrow = "53.0"
parquet = "53.0"
# Tar & Compression
tar = "0.4"
flate2 = "1.0"
# Parallel processing
rayon = "1.10"
crossbeam-channel = "0.5"
tempfile = "3.8"

[dev-dependencies]
tempfile = "3.8"

[package]
name = "birdnetpi-ebird-pack"
version = "0.1.0"
edition = "2021"

[lib]
name = "birdnetpi_ebird_pack"
path = "src/lib.rs"

[[bin]]
name = "birdnetpi-ebird-pack"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "read_benchmark"
path = "src/bin/read_benchmark.rs"

[[bin]]
name = "build-taxon-registry"
path = "src/bin/build_taxon_registry.rs"
