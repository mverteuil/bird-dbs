[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0"
]

[project]
name = "wikidata-reference-builder"
version = "0.1.0"
description = "Wikidata supplemental translations builder for BirdNET-Pi"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-SA-4.0"
authors = [
  {name = "BirdNET-Pi Contributors"}
]
keywords = ["birds", "ornithology", "wikidata", "translations", "multilingual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "click>=8.2.1",
  "pandas>=2.0.0",
  "sqlalchemy>=2.0.0",
  "requests>=2.31.0",
  "SPARQLWrapper>=2.0.0",
  "sqlmodel>=0.0.24"
]

[project.scripts]
build-wikidata-reference = "wikidata_reference_builder.wikidata_database_builder:main"
run-wikidata-poc = "wikidata_reference_builder.run_wikidata_poc:main"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/pytest-of-*"]

[tool.pyright]
exclude = ["**/build", "**/__pycache__"]
include = ["src"]
pythonVersion = "3.12"
reportMissingTypeStubs = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryIsInstance = "none"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["docs", "*.egg-info", ".git", ".venv", "data"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=.",
  "--cov-branch",
  "--cov-config=pyproject.toml",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests requiring API access",
  "unit: marks tests as unit tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP" # pyupgrade
]
ignore = [
  "E501" # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["wikidata_reference_builder"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
