[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikidata-reference-builder"
version = "0.1.0"
description = "Wikidata supplemental translations builder for BirdNET-Pi"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "BirdNET-Pi Contributors"}
]
keywords = ["birds", "ornithology", "wikidata", "translations", "multilingual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "pandas>=2.0.0",
  "sqlalchemy>=2.0.0",
  "requests>=2.31.0",
  "SPARQLWrapper>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.11.0",
  "mypy>=1.5.0",
  "types-requests>=2.31.0",
  "black>=23.7.0",
  "ruff>=0.1.0",
  "isort>=5.12.0"
]

[project.scripts]
build-wikidata-reference = "wikidata_database_builder:main"
run-wikidata-poc = "run_wikidata_poc:main"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["SPARQLWrapper.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=.",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests requiring API access",
  "unit: marks tests as unit tests"
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP" # pyupgrade
]
ignore = [
  "E501" # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["wikidata_database_builder", "wikidata_models"]
